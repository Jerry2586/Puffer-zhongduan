name: puffer-terminal
services:
  terminal:
    image: ${TERMINAL_IMAGE:-puffer-terminal:local}
    build:
      context: ${SOURCE_DIR:-..}
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      HETUN_TERMINAL_ORIGIN: ${PUBLIC_ORIGIN-https://${DOMAIN}}
      HETUN_TERMINAL_REVISION: ${REVISION:-}
      HETUN_TERMINAL_MAINTENANCE: /maintenance
      HETUN_TERMINAL_DIRECT_HTTP: ${DIRECT_HTTP:-false}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${LOCAL_PORT:-8792}:8792"
    volumes:
      - ${STATE_DIR:-/var/lib/puffer-terminal/state}:/data:Z
      - /var/lib/puffer-terminal/maintenance:/maintenance:Z
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  proxy:
    image: caddy:2-alpine
    profiles: [tls]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ${SOURCE_DIR:-..}/deploy/Caddyfile:/etc/caddy/Caddyfile:ro,Z
      - ${CADDY_DIR:-/var/lib/puffer-terminal/caddy}/data:/data:Z
      - ${CADDY_DIR:-/var/lib/puffer-terminal/caddy}/config:/config:Z
    depends_on:
      terminal:
        condition: service_healthy
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  tunnel:
    image: cloudflare/cloudflared:2026.9.1
    profiles: [tunnel]
    restart: unless-stopped
    user: "1000:1000"
    command: [tunnel, --no-autoupdate, run, --token-file, /run/hetun-token]
    volumes:
      - ${STATE_DIR:-/var/lib/puffer-terminal/state}/deployment/tunnel-token:/run/hetun-token:ro,Z
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      terminal:
        condition: service_healthy
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
